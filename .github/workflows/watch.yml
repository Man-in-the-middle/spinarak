name: Pokemon Cafe watch

# Checks every 15 minutes (UTC). Tune the cron line to check more/less often.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk xvfb
          pip install -q chromedriver-autoinstaller selenium pyvirtualdisplay

      - name: Run watcher
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
        run: python watch.py

      - name: Save state (so repeat runs only alert on NEW openings)
        run: |
          git config user.name "pokemon-watch"
          git config user.email "pokemon-watch@users.noreply.github.com"
          git add state.json hits/ 2>/dev/null || true
          git diff --quiet --cached || git commit -m "watch state $(date -u +%Y%m%d-%H%M)" || true
          git push || true
